[package]
name = "adaptive_difficulty"
version = "0.1.0"
edition = "2021"
description = "Ability-based adaptive difficulty algorithm with hysteresis buffers, designed for the peiyuan English-listening practice app."
license = "MIT OR Apache-2.0"

[lib]
name = "adaptive_difficulty"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"