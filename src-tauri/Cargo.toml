[package]
name = "peiyuan"
version = "0.1.0"
description = "跨平台英语听力练习程序"
authors = ["peiyuan"]
edition = "2021"

# Workspace 根：包含主程序 + adaptive_difficulty 子 crate（v1.1+）
[workspace]
members = [".", "adaptive_difficulty"]
resolver = "2"

# Rust edition 与 crate-type 配置
[lib]
name = "peiyuan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 2.0 核心
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-store = "2"

# 自适应难度算法 crate（v1.1+）
adaptive_difficulty = { path = "adaptive_difficulty" }

# 异步运行时
tokio = { version = "1", features = ["full"] }

# futures 工具（StreamExt 用于 SSE 流处理）
futures = "0.3"

# HTTP 客户端（含流式响应）
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }

# SSE 流式响应解析
eventsource-stream = "0.2"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 文本正则（q15_18 挖空占位符校验）
regex = "1"

# 错误处理
anyhow = "1"
thiserror = "1"

# 跨平台路径（应用数据目录）
dirs = "5"

# UUID（用于会话/缓存目录命名）
uuid = { version = "1", features = ["v4"] }

# 时间格式化
chrono = { version = "0.4", features = ["serde"] }

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# 跨平台音频采集
cpal = "0.15"

# WAV 编码
hound = "3.5"

# 音频播放
rodio = { version = "0.19", default-features = false, features = ["wav"] }

# OnceLock / Mutex 等
once_cell = "1"

# Base64（音频内嵌备用）
base64 = "0.22"

# 随机采样（场景占位符抽取）
fastrand = "2"

[features]
# 默认 Tauri 自定义协议
custom-protocol = ["tauri/custom-protocol"]
